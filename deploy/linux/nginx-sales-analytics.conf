# HTTPS in front of the dashboard.
#
# People open https://sales.example.com; Nginx decrypts and hands the request to
# the app on 127.0.0.1:8087, which is not reachable from the network itself.
#
# Before enabling, replace the three placeholders:
#   sales.example.com          the name people will type (and PUBLIC_BASE_URL)
#   ssl_certificate(_key)      your certificate -- company-issued, or from
#                              certbot if the name is publicly resolvable
#
#   sudo cp deploy/linux/nginx-sales-analytics.conf /etc/nginx/conf.d/sales-analytics.conf
#   sudo nginx -t && sudo systemctl reload nginx
#
# If Nginx already serves other systems on 443, this sits alongside them as one
# more server block -- server_name picks which site answers.

# Per-visitor limits, so one person (or a runaway script) holding down F5 cannot
# swamp the dashboard for everyone else. A page view is 2 requests (the page and
# its analysis panel); 5/s with a burst of 20 is far beyond any human, and the
# excess gets a 429 "slow down" instead of reaching the app.
limit_req_zone  $binary_remote_addr zone=sales_req:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=sales_conn:10m;

# Plain http only ever redirects, so nobody signs in over an unencrypted link.
server {
    listen 80;
    listen [::]:80;
    server_name sales.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name sales.example.com;

    ssl_certificate     /etc/ssl/certs/sales.example.com.crt;
    ssl_certificate_key /etc/ssl/private/sales.example.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SalesSSL:10m;
    ssl_session_timeout 1d;

    # Browsers remember to use https for this name for a year. Only safe once
    # https is known to work -- start with a smaller max-age if unsure.
    add_header Strict-Transport-Security "max-age=31536000" always;

    server_tokens off;
    # The only upload is the admin approve/reject form -- a few bytes.
    client_max_body_size 64k;

    location / {
        limit_req  zone=sales_req burst=20 nodelay;
        limit_conn sales_conn 10;
        limit_req_status  429;
        limit_conn_status 429;

        proxy_pass http://127.0.0.1:8087;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The Opportunities panel reads a whole year and can take a while.
        proxy_read_timeout 120s;
    }
}
